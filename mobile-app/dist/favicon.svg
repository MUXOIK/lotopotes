<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer chip ring -->
  <circle cx="50" cy="50" r="48" fill="#1e3a5f" stroke="#f59e0b" stroke-width="3"/>
  <!-- Notch segments around the edge -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6.28" stroke-dashoffset="0"/>
  <!-- Inner circle background -->
  <circle cx="50" cy="50" r="34" fill="#0f2744" stroke="#f59e0b" stroke-width="2"/>
  <!-- Dollar/Star center decoration -->
  <circle cx="50" cy="50" r="22" fill="#1d4ed8" stroke="#fbbf24" stroke-width="1.5"/>
  <!-- LP letters -->
  <text x="50" y="56" font-family="Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle" fill="#fbbf24" letter-spacing="-1">LP</text>
  <!-- Small dots at 4 cardinal positions -->
  <circle cx="50" cy="8"  r="4" fill="#fbbf24"/>
  <circle cx="50" cy="92" r="4" fill="#fbbf24"/>
  <circle cx="8"  cy="50" r="4" fill="#fbbf24"/>
  <circle cx="92" cy="50" r="4" fill="#fbbf24"/>
  <!-- Diagonal dots -->
  <circle cx="21" cy="21" r="3" fill="#fbbf24"/>
  <circle cx="79" cy="21" r="3" fill="#fbbf24"/>
  <circle cx="21" cy="79" r="3" fill="#fbbf24"/>
  <circle cx="79" cy="79" r="3" fill="#fbbf24"/>
</svg>
