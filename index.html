<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LES POTES MILLIONNAIRES - Gestionnaire Loto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        .number-ball { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; }
        .ball-blue { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .ball-green { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .confetti { position: fixed; pointer-events: none; }
    </style>
</head>
<body class="bg-gray-900 text-white">

<!-- HEADER -->
<div class="bg-gradient-to-r from-gray-900 via-gray-800 to-gray-900 border-b-4 border-red-600 py-6 px-4">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
        <h1 class="text-4xl font-bold text-yellow-400">LES POTES MILLIONNAIRES</h1>
        <span class="text-gray-400 text-sm">v1.0</span>
    </div>
</div>

<!-- MAIN CONTAINER -->
<div class="max-w-6xl mx-auto p-6">

    <!-- GRILLES SECTION -->
    <div class="bg-gradient-to-br from-purple-900 to-purple-700 rounded-xl p-8 mb-8 shadow-2xl">
        <h2 class="text-center text-2xl font-bold mb-6 text-white">⚾ GRILLES GÉNÉRÉES</h2>
        <div class="text-center text-6xl font-bold text-white mb-4">5</div>
        <button onclick="afficherGrilles()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-6 rounded-lg transition">Voir les grilles →</button>
    </div>

    <!-- DERNIER TIRAGE FDJ -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
        <div class="bg-blue-900 rounded-xl p-6 shadow-xl border-2 border-blue-400">
            <h3 class="text-blue-300 text-sm font-semibold mb-4">1er TIRAGE</h3>
            <div id="tirage1" class="text-center">
                <div class="flex justify-center gap-2 mb-4">
                    <span class="number-ball ball-blue">-</span>
                    <span class="number-ball ball-blue">-</span>
                    <span class="number-ball ball-blue">-</span>
                    <span class="number-ball ball-blue">-</span>
                    <span class="number-ball ball-blue">-</span>
                </div>
                <p class="text-yellow-400 font-bold">Chance: <span id="chance1">-</span></p>
                <p class="text-xs text-gray-400 mt-2">Chargement...</p>
            </div>
        </div>

        <div class="bg-green-900 rounded-xl p-6 shadow-xl border-2 border-green-400">
            <h3 class="text-green-300 text-sm font-semibold mb-4">2nd TIRAGE</h3>
            <div id="tirage2" class="text-center">
                <div class="flex justify-center gap-2 mb-4">
                    <span class="number-ball ball-green">-</span>
                    <span class="number-ball ball-green">-</span>
                    <span class="number-ball ball-green">-</span>
                    <span class="number-ball ball-green">-</span>
                    <span class="number-ball ball-green">-</span>
                </div>
                <p class="text-xs text-gray-400 mt-2">Pas de numéro chance</p>
                <p class="text-xs text-gray-400 mt-2">Chargement...</p>
            </div>
        </div>
    </div>

    <!-- GAINS & SOLDE -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-gradient-to-br from-yellow-900 to-yellow-800 rounded-xl p-6 shadow-xl border-2 border-yellow-500">
            <h3 class="text-yellow-200 font-bold mb-2">💰 Gains (1er + 2nd)</h3>
            <div class="text-4xl font-bold text-yellow-400">0€</div>
            <p class="text-xs text-gray-300 mt-2">Cumulé</p>
        </div>

        <div class="bg-gradient-to-br from-red-900 to-red-800 rounded-xl p-6 shadow-xl border-2 border-red-500">
            <h3 class="text-red-200 font-bold mb-2">💎 Solde Net</h3>
            <div class="text-4xl font-bold text-red-400">-2340€</div>
            <p class="text-xs text-gray-300 mt-2">ROI: 0.0%</p>
        </div>
    </div>

</div>

<script>
const BACKEND_URL = 'https://lotopotes-1.onrender.com';

// Récupérer les résultats FDJ automatiquement
async function fetchLotoResults() {
    try {
        console.log('🔍 Appel au backend:', BACKEND_URL + '/api/loto-results');
        const response = await fetch(`${BACKEND_URL}/api/loto-results`);
        const data = await response.json();
        
        console.log('📥 Réponse backend:', data);
        
        if (data.success && data.data) {
            afficherResultats(data.data);
        } else {
            console.log('⚠️ Aucun résultat trouvé');
        }
    } catch (error) {
        console.error('❌ Erreur:', error);
    }
}

function afficherResultats(result) {
    if (!result.nums || !result.chance) return;
    
    // 1er tirage
    const tirage1Html = `
        <div class="flex justify-center gap-2 mb-4">
            ${result.nums.map(n => `<span class="number-ball ball-blue">${n}</span>`).join('')}
        </div>
        <p class="text-yellow-400 font-bold">Chance: <span id="chance1">${result.chance}</span></p>
        <p class="text-xs text-gray-400 mt-2">${result.date ? new Date(result.date).toLocaleDateString('fr-FR') : 'Date inconnue'}</p>
    `;
    document.getElementById('tirage1').innerHTML = tirage1Html;
    
    // 2nd tirage (si disponible)
    if (result.nums2) {
        const tirage2Html = `
            <div class="flex justify-center gap-2 mb-4">
                ${result.nums2.map(n => `<span class="number-ball ball-green">${n}</span>`).join('')}
            </div>
            <p class="text-xs text-gray-400 mt-2">Pas de numéro chance</p>
            <p class="text-xs text-gray-400 mt-2">${result.date ? new Date(result.date).toLocaleDateString('fr-FR') : 'Date inconnue'}</p>
        `;
        document.getElementById('tirage2').innerHTML = tirage2Html;
    }
}

function afficherGrilles() {
    alert('5 grilles générées automatiquement:\n1. [7, 12, 23, 34, 45]\n2. [6, 15, 28, 39, 48]\n3. [3, 18, 31, 42, 49]\n4. [8, 19, 32, 41, 46]\n5. [5, 22, 29, 35, 44]');
}

// Charger les résultats au démarrage
window.addEventListener('load', fetchLotoResults);

// Rafraîchir toutes les 60 secondes
setInterval(fetchLotoResults, 60000);
</script>

</body>
</html>
