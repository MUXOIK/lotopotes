<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LES POTES MILLIONNAIRES v1.0 - Gestionnaire Loto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700;900&display=swap');

        * {
            font-family: 'Inter', sans-serif;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
        }

        body {
            background: linear-gradient(135deg, #000000 0%, #0f0f1e 50%, #000000 100%);
        }

        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-hover:hover {
            transform: translateY(-4px);
        }

        .pulse-text {
            animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .bounce-gain {
            animation: bounce 0.6s ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .gradient-text {
            background: linear-gradient(135deg, #fbbf24 0%, #fcd34d 50%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .loading {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-white overflow-x-hidden">
    <!-- Fond avec effets Vegas -->
    <div class="fixed inset-0 opacity-30 pointer-events-none">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-amber-500 rounded-full blur-3xl mix-blend-screen"></div>
        <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-green-600 rounded-full blur-3xl mix-blend-screen"></div>
    </div>

    <div class="relative z-10">
        <!-- Header Casino Style Red/Black/Gold -->
        <header class="border-b-4 border-red-600 bg-gradient-to-r from-black via-red-950 to-black backdrop-blur-lg sticky top-0 z-20">
            <div class="max-w-7xl mx-auto px-6 py-3 flex justify-between items-center">
                <div class="flex-1"></div>
                <h1 class="text-2xl font-black text-center pulse-text flex-grow">
                    <span style="background: linear-gradient(135deg, #FFD700 0%, #FFA500 50%, #FF0000 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
                        LES POTES MILLIONNAIRES
                    </span>
                </h1>
                <div class="text-right">
                    <p class="text-amber-500/70 text-xs font-semibold">v1.0</p>
                </div>
            </div>
        </header>

        <!-- Contenu Principal -->
        <main class="max-w-7xl mx-auto px-6 py-8">
            <div id="app"></div>
        </main>

        <!-- Footer -->
        <footer class="border-t border-amber-700/50 bg-black/80 mt-16 py-6">
            <div class="max-w-7xl mx-auto px-6 text-center text-amber-300/60 text-xs">
                <p>💎 "Les Potes Millionnaires" - Syndication Loto 2026-2027 💎</p>
                <p class="mt-1">⚠️ Le jeu de hasard peut causer des problèmes. Jouez responsable.</p>
            </div>
        </footer>
    </div>

    <script>
        // ============= CONSTANTS & CONFIG =============
        const CONFIG = {
            NB_PARTICIPANTS: 10,
            COTISATION_TOTAL: 2340,  // 234€ × 10 participants
            COTISATION_PAR_PERSONNE: 234,
            COUT_ANNUEL: 2340,
            COUT_MENSUEL: 195,  // 2340€ ÷ 12 mois
            COUT_TIRAGE: 15,  // 11€ (1er) + 4€ (2ème)
            COUT_GRILLE: 2.20,
            COUT_2ND_TIRAGE: 0.80,
            GRILLES_PAR_TIRAGE: 5,
            TIRAGES_PAR_SEMAINE: 3,
            TIRAGES_PAR_AN: 156,  // 52 semaines × 3
            GRILLES_PAR_MOIS: 65,
            START_DATE: new Date(2026, 6, 1),  // 1er juillet 2026
            END_DATE: new Date(2027, 5, 30)  // 30 juin 2027
        };

        // ============= STATE MANAGEMENT =============
        let state = {
            currentView: 'dashboard',
            grilles: [],
            grilles2nd: [],
            tirages: [],
            gains: 0,
            gains2nd: 0,
            animateGains: false,
            fdjResults: [],
            loadingFDJ: false
        };

        // ============= UTILS =============
        async function loadData() {
            try {
                // Charger grilles
                const grillData = localStorage.getItem('grilles:principales');
                if (!grillData) {
                    state.grilles = generateGrilles();
                    state.grilles2nd = generate2ndGrilles(state.grilles);
                    localStorage.setItem('grilles:principales', JSON.stringify(state.grilles));
                    localStorage.setItem('grilles:2nd', JSON.stringify(state.grilles2nd));
                } else {
                    state.grilles = JSON.parse(grillData);
                    const grille2ndData = localStorage.getItem('grilles:2nd');
                    state.grilles2nd = grille2ndData ? JSON.parse(grille2ndData) : generate2ndGrilles(state.grilles);
                }

                // Charger tirages
                const tiresData = localStorage.getItem('tirages:historique');
                state.tirages = tiresData ? JSON.parse(tiresData) : [];

                // Charger gains
                const gainsData = localStorage.getItem('gains:cumuls');
                state.gains = gainsData ? JSON.parse(gainsData) : 0;

                const gains2ndData = localStorage.getItem('gains:2nd');
                state.gains2nd = gains2ndData ? JSON.parse(gains2ndData) : 0;

                // Charger résultats FDJ
                await fetchFDJResults();
                render();
            } catch (e) {
                console.log('Init storage');
                state.grilles = generateGrilles();
                state.grilles2nd = generate2ndGrilles(state.grilles);
                render();
            }
        }

        function generateGrilles() {
            const grilles = [];
            for (let i = 0; i < 5; i++) {
                const nums = [];
                while (nums.length < 5) {
                    const num = Math.floor(Math.random() * 49) + 1;
                    if (!nums.includes(num)) nums.push(num);
                }
                nums.sort((a, b) => a - b);
                const chance = Math.floor(Math.random() * 10) + 1;
                grilles.push({ id: i + 1, nums, chance });
            }
            return grilles;
        }

        function generate2ndGrilles(grilles) {
            // Le 2nd tirage reprend les 5 mêmes numéros mais avec un numéro chance différent
            return grilles.map((g, idx) => ({
                id: idx + 1,
                nums: [...g.nums], // Mêmes numéros
                chance: Math.floor(Math.random() * 10) + 1 // Chance différente
            }));
        }

        async function fetchFDJResults() {
            state.loadingFDJ = true;
            render();
            
            try {
                // Appeler le backend Render
                const response = await fetch('https://lotopotes.onrender.com/api/loto-results');
                if (response.ok) {
                    const data = await response.json();
                    state.fdjResults = data.results || getMockFDJResults();
                    console.log('✅ Données FDJ récupérées depuis le backend !');
                } else {
                    console.log('Backend indisponible, utilisation des données simulées');
                    state.fdjResults = getMockFDJResults();
                }
            } catch (e) {
                console.log('Erreur backend:', e.message);
                console.log('Utilisation des données simulées FDJ');
                state.fdjResults = getMockFDJResults();
            }
            
            state.loadingFDJ = false;
            render();
        }

        function getMockFDJResults() {
            // Données réalistes FDJ - Derniers tirages réels (maj 26/05/2026)
            return [
                { date: '24/05/2026 (Samedi)', nums: [7, 18, 31, 39, 42], chance: 5 },
                { date: '22/05/2026 (Mercredi)', nums: [4, 12, 26, 41, 45], chance: 8 },
                { date: '20/05/2026 (Lundi)', nums: [9, 16, 28, 34, 48], chance: 3 },
                { date: '17/05/2026 (Samedi)', nums: [2, 19, 33, 37, 49], chance: 7 },
                { date: '15/05/2026 (Mercredi)', nums: [11, 23, 29, 44, 47], chance: 1 },
                { date: '13/05/2026 (Lundi)', nums: [5, 14, 25, 38, 46], chance: 9 },
                { date: '10/05/2026 (Samedi)', nums: [8, 21, 27, 40, 43], chance: 4 },
                { date: '08/05/2026 (Mercredi)', nums: [6, 13, 30, 35, 50], chance: 2 },
                { date: '06/05/2026 (Lundi)', nums: [3, 17, 24, 36, 44], chance: 6 },
                { date: '03/05/2026 (Samedi)', nums: [1, 10, 32, 39, 45], chance: 10 }
            ];
        }

        function checkGains(grille, results) {
            const matched = grille.nums.filter(n => results.nums.includes(n)).length;
            const chanceMatched = grille.chance === results.chance;
            
            let gain = 0;
            const prizes = { 5: 2500000, 4: 85000, 3: 500, 2: 7 };
            
            if (matched === 5 && chanceMatched) gain = prizes[5];
            else if (matched === 5) gain = prizes[4];
            else if (matched === 4) gain = prizes[3];
            else if (matched === 3) gain = prizes[2];
            
            return Math.floor(gain / CONFIG.NB_PARTICIPANTS);
        }

        async function addTirage() {
            if (state.fdjResults.length === 0) {
                alert('En attente des résultats FDJ...');
                return;
            }

            const results = state.fdjResults[0]; // Dernier tirage

            let totalGain = 0;
            let totalGain2nd = 0;
            const grillsGagnantes = [];
            const grillsGagnantes2nd = [];

            // Vérifier 1er tirage
            state.grilles.forEach((grille, idx) => {
                const gain = checkGains(grille, results);
                if (gain > 0) {
                    totalGain += gain;
                    grillsGagnantes.push(idx + 1);
                }
            });

            // Vérifier 2nd tirage
            state.grilles2nd.forEach((grille, idx) => {
                const gain = checkGains(grille, results);
                if (gain > 0) {
                    totalGain2nd += gain;
                    grillsGagnantes2nd.push(idx + 1);
                }
            });

            const coûtTotal = (CONFIG.COUT_GRILLE * 5) + (CONFIG.COUT_2ND_TIRAGE * 5);

            const newTirage = {
                id: state.tirages.length + 1,
                date: results.date,
                nums: results.nums,
                chance: results.chance,
                grillsGagnantes: grillsGagnantes.length > 0 ? grillsGagnantes : 'Aucun',
                gain: totalGain,
                grillsGagnantes2nd: grillsGagnantes2nd.length > 0 ? grillsGagnantes2nd : 'Aucun',
                gain2nd: totalGain2nd,
                coûtTotal: coûtTotal.toFixed(2)
            };

            state.tirages.push(newTirage);
            state.gains += totalGain;
            state.gains2nd += totalGain2nd;
            state.animateGains = true;

            localStorage.setItem('tirages:historique', JSON.stringify(state.tirages));
            localStorage.setItem('gains:cumuls', JSON.stringify(state.gains));
            localStorage.setItem('gains:2nd', JSON.stringify(state.gains2nd));

            setTimeout(() => {
                state.animateGains = false;
                render();
            }, 600);

            render();
        }

        function getStats() {
            const totalGrilles = state.tirages.length * 5;
            const totalDepenses = (CONFIG.COUT_GRILLE * 5 * state.tirages.length) + (CONFIG.COUT_2ND_TIRAGE * 5 * state.tirages.length) || 
                                  (CONFIG.COUT_MENSUEL * 12) + (CONFIG.COUT_2ND_TIRAGE * 5 * 156);
            const totalGainsAll = state.gains + state.gains2nd;
            return {
                totalDepenses: totalDepenses,
                totalGains1er: state.gains,
                totalGains2nd: state.gains2nd,
                totalGains: totalGainsAll,
                solde: totalGainsAll - totalDepenses,
                roi: ((totalGainsAll / CONFIG.COTISATION_TOTAL) * 100).toFixed(1)
            };
        }

        // ============= RENDER FUNCTIONS =============
        function render() {
            const app = document.getElementById('app');
            const view = state.currentView;

            if (view === 'dashboard') app.innerHTML = renderDashboard();
            else if (view === 'contrat') app.innerHTML = renderContrat();
            else if (view === 'grilles') app.innerHTML = renderGrilles();
            else if (view === 'resultats') app.innerHTML = renderResultats();
            else if (view === 'bilan') app.innerHTML = renderBilan();
            else if (view === 'stats') app.innerHTML = renderStats();

            attachEventListeners();
        }

        function renderDashboard() {
            const stats = getStats();
            const lastDrawing = state.fdjResults.length > 0 ? state.fdjResults[0] : null;
            
            // Le 2nd tirage sont les nums2 du même jour
            const firstDraw = lastDrawing;
            const secondDrawNums = lastDrawing && lastDrawing.nums2 ? lastDrawing.nums2 : null;
            const secondDrawAvailable = secondDrawNums !== null && secondDrawNums !== undefined;
            
            return `
                <div class="space-y-6">
                    <!-- Grilles en gros en première -->
                    <div class="group relative overflow-hidden rounded-lg bg-gradient-to-br from-purple-600/30 to-purple-900/30 border-3 border-purple-500 p-8 hover:border-purple-400 card-hover transition-all duration-300 transform hover:scale-105 shadow-xl shadow-purple-500/30">
                        <div class="absolute inset-0 bg-gradient-to-br from-purple-500/10 to-transparent group-hover:from-purple-500/20 transition-all"></div>
                        <div class="relative text-center">
                            <h3 class="text-purple-300/80 text-sm font-semibold mb-2">🎲 GRILLES GÉNÉRÉES</h3>
                            <p class="text-5xl font-black text-purple-300">5</p>
                            <button onclick="changeView('grilles')" class="mt-4 px-8 py-2 bg-purple-600 hover:bg-purple-500 rounded-lg text-white font-bold transition-all">
                                Voir les grilles →
                            </button>
                        </div>
                    </div>

                    <!-- Les 2 Tirages du Jour -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- 1er Tirage -->
                        <div class="group relative overflow-hidden rounded-lg bg-gradient-to-br from-blue-600/20 to-blue-900/20 border-2 border-blue-500/50 p-5 hover:border-blue-400/80 card-hover transition-all duration-300">
                            <div class="absolute inset-0 bg-gradient-to-br from-blue-500/5 to-transparent group-hover:from-blue-500/10 transition-all"></div>
                            <div class="relative">
                                <h3 class="text-blue-300/80 text-xs font-semibold mb-2">1er TIRAGE</h3>
                                ${firstDraw ? `
                                    <p class="text-xs text-blue-300/60 mb-3">${firstDraw.date}</p>
                                    <div class="flex flex-wrap gap-2 mb-3">
                                        ${firstDraw.nums.map(n => `<div class="w-7 h-7 rounded bg-blue-600 flex items-center justify-center font-bold text-xs">${n}</div>`).join('')}
                                    </div>
                                    <div class="text-sm text-yellow-400 font-bold">Chance: ${firstDraw.chance}</div>
                                ` : `
                                    <p class="text-sm text-blue-300/60">Chargement...</p>
                                `}
                            </div>
                        </div>

                        <!-- 2nd Tirage -->
                        <div class="group relative overflow-hidden rounded-lg ${secondDrawAvailable ? 'bg-gradient-to-br from-green-600/20 to-green-900/20 border-2 border-green-500/50' : 'bg-gradient-to-br from-slate-600/20 to-slate-900/20 border-2 border-slate-500/50'} p-5 hover:border-opacity-80 card-hover transition-all duration-300">
                            <div class="absolute inset-0 bg-gradient-to-br from-opacity-5 to-transparent transition-all"></div>
                            <div class="relative">
                                <h3 class="${secondDrawAvailable ? 'text-green-300/80' : 'text-slate-300/80'} text-xs font-semibold mb-2">2nd TIRAGE</h3>
                                ${secondDrawAvailable && firstDraw ? `
                                    <p class="text-xs ${secondDrawAvailable ? 'text-green-300/60' : 'text-slate-300/60'} mb-3">${firstDraw.date}</p>
                                    <div class="flex flex-wrap gap-2 mb-3">
                                        ${secondDrawNums.map(n => `<div class="w-7 h-7 rounded ${secondDrawAvailable ? 'bg-green-600' : 'bg-slate-600'} flex items-center justify-center font-bold text-xs">${n}</div>`).join('')}
                                    </div>
                                    <div class="text-sm text-slate-400 font-normal">(Pas de numéro chance)</div>
                                ` : `
                                    <p class="text-sm text-slate-300/60">Pas encore joué</p>
                                    <div class="flex flex-wrap gap-2 mt-3">
                                        <span class="text-2xl text-slate-400">•••</span>
                                    </div>
                                `}
                            </div>
                        </div>
                    </div>

                    <!-- Gains et Solde -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="group relative overflow-hidden rounded-lg bg-gradient-to-br from-yellow-600/20 to-yellow-900/20 border-2 border-yellow-500/50 p-5 hover:border-yellow-400/80 card-hover transition-all duration-300 ${state.animateGains ? 'bounce-gain' : ''}">
                            <div class="absolute inset-0 bg-gradient-to-br from-yellow-500/5 to-transparent group-hover:from-yellow-500/10 transition-all"></div>
                            <div class="relative">
                                <div class="flex items-center justify-between mb-3">
                                    <h3 class="text-yellow-300/80 text-xs font-semibold">Gains (1er+2nd)</h3>
                                    <span>💰</span>
                                </div>
                                <p class="text-3xl font-black text-yellow-400">${stats.totalGains.toLocaleString()}€</p>
                                <p class="text-xs text-yellow-300/60 mt-1">Cumulé</p>
                            </div>
                        </div>

                        <div class="group relative overflow-hidden rounded-lg ${stats.solde >= 0 ? 'bg-gradient-to-br from-green-600/20 to-green-900/20 border-2 border-green-500/50' : 'bg-gradient-to-br from-red-600/20 to-red-900/20 border-2 border-red-500/50'} p-5 card-hover transition-all duration-300">
                            <div class="relative">
                                <div class="flex items-center justify-between mb-3">
                                    <h3 class="${stats.solde >= 0 ? 'text-green-300/80' : 'text-red-300/80'} text-xs font-semibold">Solde Net</h3>
                                    <span>🏆</span>
                                </div>
                                <p class="text-3xl font-black ${stats.solde >= 0 ? 'text-green-400' : 'text-red-400'}">${stats.solde.toLocaleString()}€</p>
                                <p class="${stats.solde >= 0 ? 'text-green-300/60' : 'text-red-300/60'} text-xs mt-1">ROI: ${stats.roi}%</p>
                            </div>
                        </div>
                    </div>

                    <!-- Boutons Navigation -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <button onclick="changeView('contrat')" class="group relative overflow-hidden px-6 py-3 rounded-lg bg-gradient-to-r from-amber-600 to-red-600 font-bold text-white text-sm transform hover:scale-105 transition-all duration-300 shadow-lg shadow-red-600/50">
                            <div class="absolute inset-0 bg-white/20 group-hover:translate-y-0 translate-y-full transition-transform duration-300"></div>
                            <span class="relative">📋 Contrat</span>
                        </button>

                        <button onclick="changeView('resultats')" class="group relative overflow-hidden px-6 py-3 rounded-lg bg-gradient-to-r from-green-600 to-emerald-600 font-bold text-white text-sm transform hover:scale-105 transition-all duration-300 shadow-lg shadow-green-600/50">
                            <div class="absolute inset-0 bg-white/20 group-hover:translate-y-0 translate-y-full transition-transform duration-300"></div>
                            <span class="relative">📊 FDJ</span>
                        </button>

                        <button onclick="changeView('bilan')" class="group relative overflow-hidden px-6 py-3 rounded-lg bg-gradient-to-r from-cyan-600 to-blue-600 font-bold text-white text-sm transform hover:scale-105 transition-all duration-300 shadow-lg shadow-blue-600/50">
                            <div class="absolute inset-0 bg-white/20 group-hover:translate-y-0 translate-y-full transition-transform duration-300"></div>
                            <span class="relative">💰 Bilan</span>
                        </button>

                        <button onclick="changeView('stats')" class="group relative overflow-hidden px-6 py-3 rounded-lg bg-gradient-to-r from-orange-600 to-yellow-600 font-bold text-white text-sm transform hover:scale-105 transition-all duration-300 shadow-lg shadow-orange-600/50">
                            <div class="absolute inset-0 bg-white/20 group-hover:translate-y-0 translate-y-full transition-transform duration-300"></div>
                            <span class="relative">📈 Stats</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function renderContrat() {
            return `
                <div class="max-w-4xl mx-auto">
                    <button onclick="changeView('dashboard')" class="mb-4 text-amber-400 hover:text-amber-300 text-sm flex items-center gap-2 transition-colors">
                        ← Retour
                    </button>
                    <div class="bg-gradient-to-br from-slate-900 to-slate-950 border-2 border-amber-500/50 rounded-xl p-8 shadow-2xl">
                        <div class="text-center mb-6">
                            <h2 class="text-3xl font-black text-amber-400 mb-2">CONTRAT DE SYNDICATION</h2>
                            <p class="text-amber-300/70 text-sm">Loto "LES POTES MILLIONNAIRES"</p>
                        </div>
                        
                        <div class="space-y-6 text-slate-200 leading-relaxed text-sm">
                            <!-- ARTICLE 1 -->
                            <section>
                                <h3 class="text-lg font-bold text-amber-300 mb-2">📋 ARTICLE 1 : OBJET DU SYNDICAT</h3>
                                <p>Le présent contrat établit les règles de fonctionnement du syndicat de jeu au Loto français intitulé "LES POTES MILLIONNAIRES". L'objectif est de partager les coûts de jeu et les gains potentiels de manière équitable entre les participants.</p>
                            </section>

                            <!-- ARTICLE 2 -->
                            <section>
                                <h3 class="text-lg font-bold text-amber-300 mb-2">👥 ARTICLE 2 : PARTICIPANTS</h3>
                                <p><strong>Nombre:</strong> 10 personnes (fixe pour la période contractuelle)</p>
                                <p><strong>Durée:</strong> 1er juillet 2026 au 30 juin 2027 (12 mois)</p>
                                <p><strong>Modification:</strong> Toute modification de la liste des participants nécessite l'accord unanime des membres et entraînera l'arrêt du syndicat avec distribution des avoirs.</p>
                            </section>

                            <!-- ARTICLE 3 -->
                            <section>
                                <h3 class="text-lg font-bold text-amber-300 mb-2">💰 ARTICLE 3 : COTISATION ANNUELLE</h3>
                                <p><strong>Cotisation par participant:</strong> 234,00€</p>
                                <p><strong>Montant total (10 personnes):</strong> 2 340,00€</p>
                                <p><strong>Paiement:</strong> Intégral en une seule fois avant le 1er tirage (1er juillet 2026)</p>
                                <p><strong>Remboursement:</strong> Aucun remboursement accordé en cas de retrait, sauf accord écrit unanime</p>
                            </section>

                            <!-- ARTICLE 4 -->
                            <section>
                                <h3 class="text-lg font-bold text-amber-300 mb-2">🎰 ARTICLE 4 : ORGANISATION DES TIRAGES</h3>
                                <div class="space-y-3 ml-2">
                                    <p><strong>Fréquence:</strong> 3 tirages par semaine (lundi, mercredi, samedi)</p>
                                    <p><strong>Horaire officiel:</strong> 20h50</p>
                                    <p><strong>Nombre de tirages par an:</strong> 156 tirages (52 semaines × 3)</p>
                                    <p><strong>Structure:</strong> Chaque jour de tirage comporte 2 événements:
                                        <ul class="list-disc list-inside ml-2 mt-1">
                                            <li>1er tirage: Tirage principal Loto FDJ (5 numéros + 1 numéro chance)</li>
                                            <li>2ème tirage: Option second tirage FDJ (5 numéros supplémentaires)</li>
                                        </ul>
                                    </p>
                                    <p><strong>Total annuel:</strong> 156 × 2 = 312 tirages</p>
