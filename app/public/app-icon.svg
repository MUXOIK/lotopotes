<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Gold border ring -->
  <rect x="16" y="16" width="480" height="480" rx="80" fill="none" stroke="#f59e0b" stroke-width="8"/>
  <!-- Dice face (simplified) -->
  <rect x="128" y="128" width="256" height="256" rx="40" fill="url(#gold)"/>
  <!-- Dice dots -->
  <circle cx="196" cy="196" r="20" fill="#1e3a8a"/>
  <circle cx="316" cy="196" r="20" fill="#1e3a8a"/>
  <circle cx="256" cy="256" r="20" fill="#1e3a8a"/>
  <circle cx="196" cy="316" r="20" fill="#1e3a8a"/>
  <circle cx="316" cy="316" r="20" fill="#1e3a8a"/>
</svg>
